version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: linux-190-deploy/Dockerfile
    container_name: admin-web-staging
    restart: unless-stopped
    ports:
      - "8108:443"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  frontend-network:
    driver: bridge

volumes:
  certbot-conf:
    external: true
    name: linux-190-deploy_certbot-conf
  certbot-www:
    external: true
    name: linux-190-deploy_certbot-www
