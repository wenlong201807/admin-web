version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: linux-190-deploy/Dockerfile
    container_name: admin-web-staging
    restart: unless-stopped
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  frontend-network:
    external: true
    name: linux-190-deploy_frontend-network
